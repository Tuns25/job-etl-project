name: Deploy to AWS Lambda

on:
  push:
    branches: [ main ] # Tự động chạy mỗi khi bạn push code lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1 # Đổi thành region của bạn (ví dụ: ap-southeast-1 cho Singapore)

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: job-market-crawler # Tên repository bạn đã tạo ở Bước 2 (ECR)
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Lambda Function
        run: |
          # Thay 'JobMarketCrawlerFunction' bằng tên hàm Lambda thật của bạn trên AWS
          aws lambda update-function-code \
            --function-name JobMarketCrawlerFunction \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/job-market-crawler:latest